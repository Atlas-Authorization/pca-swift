    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: RSA DPoP corpus (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "$MONO/sdks/swift-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated by the TypeScript reference; never committed)
        if: matrix.setup == 'mpc'
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/swift-pca/test-data" mpc-ot:mpc-ot
      - name: Linux build tools, libsodium, SQLite headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential perl pkg-config libsodium-dev libsqlite3-dev
      # openssl.yml
      - name: libcrypto through pkg-config (the distro OpenSSL 3)
        if: matrix.setup == 'openssl'
        run: sudo apt-get install -y -qq libssl-dev
      # mpc.yml
      - name: OpenSSL (cached)
        if: matrix.setup == 'mpc'
        id: ossl
        uses: actions/cache@v4
        with:
          path: ~/openssl35
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build OpenSSL at the pinned release
        if: matrix.setup == 'mpc' && steps.ossl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/openssl.tgz" "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          echo "$OPENSSL_SHA256  $RUNNER_TEMP/openssl.tgz" | shasum -a 256 -c -
          tar xzf "$RUNNER_TEMP/openssl.tgz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-$OPENSSL_VERSION"
          ./config --prefix="$HOME/openssl35" --libdir=lib shared no-tests > /dev/null
          make -j4 > /dev/null
          make install_sw > /dev/null
      - name: libcrypto through pkg-config (the pinned 3.5 build)
        if: matrix.setup == 'mpc'
        run: |
          echo "PKG_CONFIG_PATH=$HOME/openssl35/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/openssl35/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          test "$(PKG_CONFIG_PATH=$HOME/openssl35/lib/pkgconfig pkg-config --modversion libcrypto)" = "$OPENSSL_VERSION"
          echo "PCA_MPC_REQUIRE_KEM=1" >> "$GITHUB_ENV"
      - name: Swift toolchain cache (restore)
        id: swcache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/swift
          key: swift-6.2-ubuntu24.04
      - name: Linux toolchain (Swift 6.2, swift-crypto)
        working-directory: ${{ env.MONO }}
        run: |
          bash tools/pca-audit/swift-mutate/linux-prep.sh sdks/swift-pca
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
      - name: Mutate the module (every line, oracle = the module's own test classes)
        working-directory: ${{ env.MONO }}
        env:
          SWIFTMUT_FILTER: ${{ matrix.filter }}
          MOD_SETUP: ${{ matrix.setup }}
          MOD_DIRS: ${{ matrix.dirs }}
          MOD_OF: ${{ matrix.of }}
          MOD_OFF: ${{ matrix.off }}
        run: |
          # the package switch of each module (what its replay workflow sets)
          case "$MOD_SETUP" in
            # optimised: RefMpcOtTests.testOtStack (the 440-case OT/EC replay) was 360 of the oracle's 361 s in a debug build. No assert()/#if DEBUG in
            # AtlasPCAMpc, its tests or the verifier they link, so -O gives the debug build's verdicts
            mpc) export ATLAS_PCA_MPC=1 SWIFT_TEST_FLAGS='-Xswiftc -O' ;;
            # an optimised build (mutate.mjs passes SWIFT_TEST_FLAGS to swift build/test): the MpcNet parties' debug-build crypto starves a niced mesh
            # into timeouts that mask the abort a test expects
            mpcnet) export ATLAS_PCA_MPC=1 ATLAS_PCA_LWEOT=1 SWIFT_TEST_FLAGS='-Xswiftc -O' ;;
            openssl) export ATLAS_PCA_OPENSSL=1 ;;
            wasm) export ATLAS_PCA_WASMKIT=1 ;;
            less) export ATLAS_PCA_LESS=1 ;;
          esac
          export TMPDIR="$RUNNER_TEMP/smt"; mkdir -p "$TMPDIR"
          for w in $(seq 0 $((WORKERS - 1))); do
            mkdir -p "$TMPDIR/swiftmut/w$w/sdks/swift-pca"
            ln -sfn "$MONO/sdks/swift-pca/conformance" "$TMPDIR/swiftmut/w$w/sdks/swift-pca/conformance"
          done
          FILES="$(cd sdks/swift-pca && find $MOD_DIRS -name '*.swift' | LC_ALL=C sort | tr '\n' ' ')"
          node tools/pca-audit/swift-mutate/mutate.mjs run "$WORKERS" 320 "$RUNNER_TEMP/raw.json" $FILES \
            --every="$MOD_OF" --offset="$MOD_OFF"
          node -e '
            const fs = require("fs"); const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const want = Number(process.argv[2]); if (!(want > 0) || r.length < want) { console.error(`budget ran out: ${r.length} of ${want} mutants`); process.exit(1); }
          ' "$RUNNER_TEMP/raw.json" "$(node tools/pca-audit/swift-mutate/mutate.mjs list $(for f in $FILES; do echo sdks/swift-pca/$f; done) 2>/dev/null | awk -v n="$MOD_OF" -v k="$MOD_OFF" 'END{print int((k+1)*NR/n) - int(k*NR/n)}')"
      - name: Keep results (also a partial slice when the budget ran out or the job was cancelled)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/mut-results"; [ -f "$RUNNER_TEMP/raw.json" ] && cp "$RUNNER_TEMP/raw.json" "$RUNNER_TEMP/mut-results/results.json" || true
      - name: Report
        run: |
          node "$MONO/tools/pca-audit/swift-mutate/mutate.mjs" survivors --src="$MONO/sdks/swift-pca" "$RUNNER_TEMP/raw.json" > survivors-raw.json
          node -e '
            const fs = require("fs"); const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const k = process.argv[2];
            const counts = {}; for (const m of r) counts[m.status] = (counts[m.status] || 0) + 1;
            const s = JSON.parse(fs.readFileSync("survivors-raw.json", "utf8")).map((x) => { const o = { ...x }; if (o.occurrence === undefined) delete o.occurrence; return o; });
            fs.writeFileSync("counts.json", JSON.stringify(counts)); fs.writeFileSync("survivors.json", JSON.stringify(s));
            const errs = r.filter((m) => m.status === "RUNERR" || m.status === "TIMEOUT").map((m) => ({ file: m.file, lineno: m.line, text: m.orig, mutant: `${m.op} => ${m.repl}`, status: m.status, evidence: m.evidence ?? "timeout" }));
            fs.writeFileSync(`run-errors-${k}.json`, JSON.stringify(errs, null, 1));
            fs.writeFileSync(`traps-${k}.json`, JSON.stringify(r.filter((m) => m.status === "TRAP").map((m) => ({ file: m.file, lineno: m.line, text: m.orig, mutant: `${m.op} => ${m.repl}`, test: m.trap?.test, message: m.trap?.message })), null, 1));
          ' "$RUNNER_TEMP/raw.json" ${{ matrix.shard }}
          node .github/scripts/mutation-shard-report.mjs --crate="$CRATE" --shard=${{ matrix.shard }} --of="$REPORTS" --tool=swift-mutate \
            --counts=counts.json --survivors=survivors.json --out=shard-${{ matrix.shard }}.json
      - name: Collect the report files next to the results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/mut-results"
          cp shard-${{ matrix.shard }}.json run-errors-${{ matrix.shard }}.json traps-${{ matrix.shard }}.json "$RUNNER_TEMP/mut-results/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mut-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/mut-results/
          retention-days: 30
          if-no-files-found: ignore

  # AtlasPCAVDF (oracle: its own test target AtlasPCAVDFTests, optimised build, ATLAS_VDF_FULL), in two tiers. One replay case, hashToPrime/bits8192,
  # is ~99% of the full oracle (19-25 min at -O; the other 6672 cases and the other VDF tests ~40 s), so judging every mutant by the full oracle cost
  # ~30 min per mutant. Tier 1 (`vdf`, 60 slices) judges every mutant by every case but the solo ones (ATLAS_VDF_SHARD=0/1) plus the other VDF tests:
  # a few minutes each, and its kills are final (a test that ran the mutant failed). Each tier-1 SURVIVED or TIMEOUT mutant is judged again by the FULL
  # oracle (every case, bits8192 included: the verdict the full oracle gives) in `vdf-full`, one mutant per worker; its `oracle` leg verifies the
  # full oracle ONCE on the unmutated tree (so no tier-2 job pays those 20 min). `vdf-report` writes reports 514..519 from both tiers. Linux, like
  # module-linux: the module has no platform conditional and ci.yml replays it on Linux too.
  vdf:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    name: AtlasPCAVDF ${{ matrix.off }}/${{ matrix.of }} (tier 1, linux)
    needs: reuse
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { off: 0, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 1, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 2, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 3, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 4, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 5, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 6, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 7, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 8, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 9, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 10, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 11, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 12, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 13, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 14, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 15, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 16, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 17, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 18, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 19, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 20, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 21, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 22, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 23, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 24, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 25, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 26, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 27, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 28, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 29, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 30, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 31, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 32, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 33, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 34, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 35, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 36, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 37, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 38, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 39, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 40, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 41, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 42, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 43, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 44, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 45, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 46, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 47, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 48, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 49, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 50, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 51, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 52, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 53, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 54, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 55, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 56, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 57, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 58, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: 59, of: 60, dirs: 'Sources/AtlasPCAVDF' }
          - { off: oracle, of: 60, dirs: 'Sources/AtlasPCAVDF' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: RSA DPoP corpus (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "$MONO/sdks/swift-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Linux build tools, libsodium, SQLite headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential perl pkg-config libsodium-dev libsqlite3-dev
      - name: Swift toolchain cache (restore)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/swift
          key: swift-6.2-ubuntu24.04
      - name: Linux toolchain (Swift 6.2, swift-crypto)
        working-directory: ${{ env.MONO }}
        run: |
          bash tools/pca-audit/swift-mutate/linux-prep.sh sdks/swift-pca
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
      - name: Tier 1 (every case but the solo ones), or verify the full oracle once (the oracle leg)
        working-directory: ${{ env.MONO }}
        env:
          SWIFTMUT_FILTER: AtlasPCAVDFTests
          MOD_DIRS: ${{ matrix.dirs }}
          MOD_OF: ${{ matrix.of }}
          MOD_OFF: ${{ matrix.off }}
        run: |
          export ATLAS_VDF_FULL=1 SWIFT_TEST_FLAGS='-Xswiftc -O'
          export TMPDIR="$RUNNER_TEMP/smt"; mkdir -p "$TMPDIR"
          for w in $(seq 0 $((WORKERS - 1))); do
            mkdir -p "$TMPDIR/swiftmut/w$w/sdks/swift-pca"
            ln -sfn "$MONO/sdks/swift-pca/conformance" "$TMPDIR/swiftmut/w$w/sdks/swift-pca/conformance"
          done
          FILES="$(cd sdks/swift-pca && find $MOD_DIRS -name '*.swift' | LC_ALL=C sort | tr '\n' ' ')"
          if [ "$MOD_OFF" = oracle ]; then
            node tools/pca-audit/swift-mutate/mutate.mjs run "$WORKERS" 320 "$RUNNER_TEMP/unused.json" $FILES --oracle-out="$RUNNER_TEMP/vdf-oracle"
            exit 0
          fi
          export ATLAS_VDF_SHARD=0/1 # every case of the corpus except VdfReplayTests.soloCases, each accounted for by the test itself
          node tools/pca-audit/swift-mutate/mutate.mjs run "$WORKERS" 320 "$RUNNER_TEMP/raw.json" $FILES --every="$MOD_OF" --offset="$MOD_OFF"
          node -e '
            const fs = require("fs"); const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const want = Number(process.argv[2]); if (!(want > 0) || r.length < want) { console.error(`budget ran out: ${r.length} of ${want} mutants`); process.exit(1); }
          ' "$RUNNER_TEMP/raw.json" "$(node tools/pca-audit/swift-mutate/mutate.mjs list $(for f in $FILES; do echo sdks/swift-pca/$f; done) 2>/dev/null | awk -v n="$MOD_OF" -v k="$MOD_OFF" 'END{print int((k+1)*NR/n) - int(k*NR/n)}')"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.off != 'oracle' }} # also a partial slice (budget ran out, cancelled)
        with:
          name: vdf-t1-${{ matrix.off }}
          path: ${{ runner.temp }}/raw.json
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.off == 'oracle' }}
        with:
          name: vdf-oracle
          path: ${{ runner.temp }}/vdf-oracle/oracle.json
          retention-days: 3

  # the tier-1 SURVIVED and TIMEOUT mutants of all 60 slices, WORKERS per chunk (one per worker: a full-oracle run is ~20 min)
  vdf-plan:
    needs: vdf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      n: ${{ steps.plan.outputs.n }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: t1
          pattern: vdf-t1-*
      - id: plan
        env:
          T1: '60'
        run: |
          mkdir -p chunks
          node -e '
            const fs = require("fs");
            const n1 = Number(process.env.T1), per = Number(process.env.WORKERS);
            const todo = [];
            for (let j = 0; j < n1; j++) for (const r of JSON.parse(fs.readFileSync(`t1/vdf-t1-${j}/raw.json`, "utf8"))) if (r.status === "SURVIVED" || r.status === "TIMEOUT") todo.push(r);
            todo.sort((a, b) => a.file.localeCompare(b.file) || a.idx - b.idx);
            const n = Math.ceil(todo.length / per);
            if (n > 256) { console.error(`::error::${todo.length} tier-1 survivors need ${n} full-oracle jobs, over the 256 of one matrix`); process.exit(1); }
            for (let i = 0; i < n; i++) fs.writeFileSync(`chunks/chunk-${i}.json`, JSON.stringify(todo.slice(i * per, (i + 1) * per)));
            console.log(`${todo.length} tier-1 survivor(s) / timeout(s) -> ${n} full-oracle job(s)`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `n=${n}\nmatrix=${JSON.stringify({ chunk: n ? [...Array(n).keys()] : [0] })}\n`);
          '
      - uses: actions/upload-artifact@v4
        if: ${{ steps.plan.outputs.n != '0' }}
        with:
          name: vdf-t2-plan
          path: chunks/
          retention-days: 3

  vdf-full:
    needs: [vdf, vdf-plan]
    if: ${{ needs.vdf-plan.outputs.n != '0' }}
    name: AtlasPCAVDF full oracle ${{ matrix.chunk }}/${{ needs.vdf-plan.outputs.n }} (tier 2, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.vdf-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: RSA DPoP corpus (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "$MONO/sdks/swift-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Linux build tools, libsodium, SQLite headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential perl pkg-config libsodium-dev libsqlite3-dev
      - name: Swift toolchain cache (restore)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/swift
          key: swift-6.2-ubuntu24.04
      - name: Linux toolchain (Swift 6.2, swift-crypto)
        working-directory: ${{ env.MONO }}
        run: |
          bash tools/pca-audit/swift-mutate/linux-prep.sh sdks/swift-pca
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: vdf-oracle
          path: ${{ runner.temp }}/vdf-oracle
      - uses: actions/download-artifact@v4
        with:
          name: vdf-t2-plan
          path: ${{ runner.temp }}/plan
      - name: Tier 2 (the full oracle, bits8192 included) for this chunk of tier-1 survivors
        working-directory: ${{ env.MONO }}
        env:
          SWIFTMUT_FILTER: AtlasPCAVDFTests
          MOD_DIRS: Sources/AtlasPCAVDF
          CHUNK: ${{ runner.temp }}/plan/chunk-${{ matrix.chunk }}.json
        run: |
          export ATLAS_VDF_FULL=1 SWIFT_TEST_FLAGS='-Xswiftc -O'
          export TMPDIR="$RUNNER_TEMP/smt"; mkdir -p "$TMPDIR"
          for w in $(seq 0 $((WORKERS - 1))); do
            mkdir -p "$TMPDIR/swiftmut/w$w/sdks/swift-pca"
            ln -sfn "$MONO/sdks/swift-pca/conformance" "$TMPDIR/swiftmut/w$w/sdks/swift-pca/conformance"
          done
          FILES="$(cd sdks/swift-pca && find $MOD_DIRS -name '*.swift' | LC_ALL=C sort | tr '\n' ' ')"
          # --oracle-in: the oracle leg verified this exact tree + selection; a mismatch makes mutate.mjs verify it here (a warning, slower, still sound)
          node tools/pca-audit/swift-mutate/mutate.mjs run "$WORKERS" 320 "$RUNNER_TEMP/raw.json" $FILES --retry="$CHUNK" --oracle-in="$RUNNER_TEMP/vdf-oracle"
          node -e '
            const fs = require("fs"); const got = new Set(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).map((r) => `${r.file}#${r.idx}`));
            const miss = JSON.parse(fs.readFileSync(process.argv[2], "utf8")).filter((r) => !got.has(`${r.file}#${r.idx}`));
            if (miss.length) { console.error(`budget ran out: ${miss.length} mutant(s) of the chunk without a full-oracle verdict`); process.exit(1); }
          ' "$RUNNER_TEMP/raw.json" "$CHUNK"
      - uses: actions/upload-artifact@v4
        with:
          name: vdf-t2-${{ matrix.chunk }}
          path: ${{ runner.temp }}/raw.json
          retention-days: 3

  # reports 514..519: tier-1 slices 10p..10p+9 each, every tier-1 SURVIVED / TIMEOUT replaced by its full-oracle verdict (a missing one fails)
  vdf-report:
    needs: [vdf, vdf-plan, vdf-full]
    if: ${{ !cancelled() && needs.vdf-plan.result == 'success' && (needs.vdf-full.result == 'success' || needs.vdf-full.result == 'skipped') }}
    name: AtlasPCAVDF report ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 514, part: 0 }
          - { shard: 515, part: 1 }
          - { shard: 516, part: 2 }
          - { shard: 517, part: 3 }
          - { shard: 518, part: 4 }
          - { shard: 519, part: 5 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - uses: actions/download-artifact@v4
        with:
          path: t1
          pattern: vdf-t1-*
      - uses: actions/download-artifact@v4
        if: ${{ needs.vdf-full.result == 'success' }}
        with:
          path: t2
          pattern: vdf-t2-*
      - name: Combine the tiers
        env:
          PART: ${{ matrix.part }}
          PER: '10'
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const part = Number(process.env.PART), per = Number(process.env.PER);
            const t2 = new Map();
            for (const d of fs.existsSync("t2") ? fs.readdirSync("t2") : []) for (const r of JSON.parse(fs.readFileSync(path.join("t2", d, "raw.json"), "utf8"))) t2.set(`${r.file}#${r.idx}`, r);
            const out = [];
            for (let j = part * per; j < (part + 1) * per; j++) for (const r of JSON.parse(fs.readFileSync(`t1/vdf-t1-${j}/raw.json`, "utf8"))) {
              if (r.status !== "SURVIVED" && r.status !== "TIMEOUT") { out.push(r); continue; }
              const s = t2.get(`${r.file}#${r.idx}`);
              if (!s) { console.error(`::error::no full-oracle verdict for the tier-1 ${r.status} ${r.file}:${r.line} ${r.op} => ${r.repl}`); process.exit(1); }
              out.push({ ...s, tier1: r.status });
            }
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "raw.json"), JSON.stringify(out, null, 1));
            console.log(`report part ${part}: ${out.length} mutants, ${out.filter((r) => r.tier1).length} judged again by the full oracle`);
          '
      - name: Report
        run: |
          node "$MONO/tools/pca-audit/swift-mutate/mutate.mjs" survivors --src="$MONO/sdks/swift-pca" "$RUNNER_TEMP/raw.json" > survivors-raw.json
          node -e '
            const fs = require("fs"); const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const k = process.argv[2];
            const counts = {}; for (const m of r) counts[m.status] = (counts[m.status] || 0) + 1;
            const s = JSON.parse(fs.readFileSync("survivors-raw.json", "utf8")).map((x) => { const o = { ...x }; if (o.occurrence === undefined) delete o.occurrence; return o; });
            fs.writeFileSync("counts.json", JSON.stringify(counts)); fs.writeFileSync("survivors.json", JSON.stringify(s));
            const errs = r.filter((m) => m.status === "RUNERR" || m.status === "TIMEOUT").map((m) => ({ file: m.file, lineno: m.line, text: m.orig, mutant: `${m.op} => ${m.repl}`, status: m.status, evidence: m.evidence ?? "timeout" }));
            fs.writeFileSync(`run-errors-${k}.json`, JSON.stringify(errs, null, 1));
            fs.writeFileSync(`traps-${k}.json`, JSON.stringify(r.filter((m) => m.status === "TRAP").map((m) => ({ file: m.file, lineno: m.line, text: m.orig, mutant: `${m.op} => ${m.repl}`, test: m.trap?.test, message: m.trap?.message })), null, 1));
          ' "$RUNNER_TEMP/raw.json" ${{ matrix.shard }}
          node .github/scripts/mutation-shard-report.mjs --crate="$CRATE" --shard=${{ matrix.shard }} --of="$REPORTS" --tool=swift-mutate \
            --counts=counts.json --survivors=survivors.json --out=shard-${{ matrix.shard }}.json
          mkdir -p "$RUNNER_TEMP/mut-results"
          cp "$RUNNER_TEMP/raw.json" "$RUNNER_TEMP/mut-results/results.json"
          cp shard-${{ matrix.shard }}.json run-errors-${{ matrix.shard }}.json traps-${{ matrix.shard }}.json "$RUNNER_TEMP/mut-results/"
      - uses: actions/upload-artifact@v4
        with:
          name: mut-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/mut-results/
          retention-days: 30

  # Our own C/C++ sources, which swift-mutate does not touch: each mutant of c-mutants/<name>.mutants.json (a literal replacement in one line) is applied in
  # place, the package is rebuilt incrementally and the target's own tests must fail (c-mutate.sh, the pattern of the Go lessc gate). A survivor fails
  # unless c-mutants/<name>.ledger.json proves it equivalent; build-failed, crash and timeout always fail. The unmutated baseline must pass first.
  cmutants:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: reuse
    name: C ${{ matrix.name }} ${{ matrix.off }}/${{ matrix.of }} (from 0)
    runs-on: macos-latest
    timeout-minutes: 350
    env:
      BLST_TAG: v0.3.16
      BLST_COMMIT: e7f90de551e8df682f3cc99067d204d8b90d27ad
      ADA_TAG: v4.0.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: pca_gt, src: Sources/CBlst/pca_gt.c, setup: pairing, of: 4, off: 0, filter: 'AtlasPCAPairingTests' }
          - { name: pca_gt, src: Sources/CBlst/pca_gt.c, setup: pairing, of: 4, off: 1, filter: 'AtlasPCAPairingTests' }
          - { name: pca_gt, src: Sources/CBlst/pca_gt.c, setup: pairing, of: 4, off: 2, filter: 'AtlasPCAPairingTests' }
          - { name: pca_gt, src: Sources/CBlst/pca_gt.c, setup: pairing, of: 4, off: 3, filter: 'AtlasPCAPairingTests' }
          - { name: ada_shim, src: Sources/CAda/ada_shim.cpp, setup: ada, of: 2, off: 0, filter: 'AdaShimTests|RefVcTests|RefCibaTests|RefOAuthTests|RefWebBotAuthTests' }
          - { name: ada_shim, src: Sources/CAda/ada_shim.cpp, setup: ada, of: 2, off: 1, filter: 'AdaShimTests|RefVcTests|RefCibaTests|RefOAuthTests|RefWebBotAuthTests' }
          - { name: atlas_less, src: Sources/CLess/atlas_less.c, setup: less, of: 6, off: 0, filter: 'LessCoreSuiteTests|LessNativeTests', skip: 'testCopyMatchesCanonical' }
          - { name: atlas_less, src: Sources/CLess/atlas_less.c, setup: less, of: 6, off: 1, filter: 'LessCoreSuiteTests|LessNativeTests', skip: 'testCopyMatchesCanonical' }
          - { name: atlas_less, src: Sources/CLess/atlas_less.c, setup: less, of: 6, off: 2, filter: 'LessCoreSuiteTests|LessNativeTests', skip: 'testCopyMatchesCanonical' }
          - { name: atlas_less, src: Sources/CLess/atlas_less.c, setup: less, of: 6, off: 3, filter: 'LessCoreSuiteTests|LessNativeTests', skip: 'testCopyMatchesCanonical' }
          - { name: atlas_less, src: Sources/CLess/atlas_less.c, setup: less, of: 6, off: 4, filter: 'LessCoreSuiteTests|LessNativeTests', skip: 'testCopyMatchesCanonical' }
          - { name: atlas_less, src: Sources/CLess/atlas_less.c, setup: less, of: 6, off: 5, filter: 'LessCoreSuiteTests|LessNativeTests', skip: 'testCopyMatchesCanonical' }
          - { name: cmldsa, src: Sources/CMLDSA/cmldsa.c, setup: mldsa, of: 2, off: 0, filter: 'MlDsaBackendsTests/testVendoredKeysAndSignaturesAtBothLevels' }
          - { name: cmldsa, src: Sources/CMLDSA/cmldsa.c, setup: mldsa, of: 2, off: 1, filter: 'MlDsaBackendsTests/testVendoredKeysAndSignaturesAtBothLevels' }
          - { name: cmldsa_random, src: Sources/CMLDSA/cmldsa_random.c, setup: mldsa, of: 1, off: 0, filter: 'MlDsaBackendsTests/testVendoredKeysAndSignaturesAtBothLevels' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select Xcode 26 (the verifier's ML-DSA CryptoKit API; WasmKit needs the newest)
        run: |
          x="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$x" ] || { echo "::error::no Xcode 26 on this image"; exit 1; }
          sudo xcode-select -s "$x"
      - name: Flagship tooling + source layout
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: RSA DPoP corpus (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "$MONO/sdks/swift-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated by the TypeScript reference; never committed)
        if: matrix.setup == 'pairing'
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/swift-pca/test-data" abe:abe
      - name: blst at the pinned commit, into the C target
        if: matrix.setup == 'pairing'
        run: |
          git clone --quiet --depth 1 --branch "$BLST_TAG" https://github.com/supranational/blst "$RUNNER_TEMP/blst"
          test "$(git -C "$RUNNER_TEMP/blst" rev-parse HEAD)" = "$BLST_COMMIT"
          S="$MONO/sdks/swift-pca/Sources/CBlst"
          mkdir -p "$S/blst"
          cp -R "$RUNNER_TEMP/blst/src" "$RUNNER_TEMP/blst/build" "$RUNNER_TEMP/blst/bindings" "$S/blst/"
          cp "$RUNNER_TEMP/blst/bindings/blst.h" "$RUNNER_TEMP/blst/bindings/blst_aux.h" "$S/include/"
      - name: Ada amalgamation at the pinned release (the shim links it)
        if: matrix.setup == 'ada'
        env:
          ADA_CPP_SHA256: 1c722f8f5355d6bf2bf3601870684edc875aa8f56b4d4735440d96263dd0207c
          ADA_H_SHA256: 0010b17b3ff489e13998e86d921b16e1643e370ee3276c584f1b0c4b72bdf628
        run: |
          S="$MONO/sdks/swift-pca/Sources/CAda"
          echo "$ADA_CPP_SHA256  $S/ada.cpp" | shasum -a 256 -c -
          echo "$ADA_H_SHA256  $S/ada.h" | shasum -a 256 -c -
      - name: Mutate the C source
        working-directory: ${{ env.MONO }}/sdks/swift-pca
        env:
          SLICE_OF: ${{ matrix.of }}
          SLICE_OFF: ${{ matrix.off }}
          SKIP_FILTER: ${{ matrix.skip }}
        run: |
          case "${{ matrix.setup }}" in less) export ATLAS_PCA_LESS=1 ;; esac
          cp "$GITHUB_WORKSPACE/.github/scripts/c-mutate.sh" "$RUNNER_TEMP/c-mutate.sh"
          bash "$RUNNER_TEMP/c-mutate.sh" "${{ matrix.name }}" "${{ matrix.src }}" "${{ matrix.filter }}"

  merge:
    needs: [reuse, collect, apple-report, module, module-linux, vdf-report, cmutants]
    if: ${{ needs.reuse.outputs.skip != 'true' && (always()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The C mutation gate passed
        run: |
          [ "${{ needs.cmutants.result }}" = success ] || { echo "::error::cmutants: ${{ needs.cmutants.result }}"; exit 1; }
      - name: Flagship checker + ledger
        run: .github/scripts/mutation-layout.sh "$CRATE"
      # the plan is every *.swift under Sources (recursive). Fail on what that find would miss: a target outside Sources, other compiled sources, a narrowed plan.
      - name: Every shipped source is in the mutation plan
        run: |
          # swift-mutate mutates only Swift. Every other source file under Sources is named in c-mutants/c-sources.json: "mutated" (our own C/C++, the cmutants
          # job: its mutants and ledger must exist), "vendored" (upstream code, with the reason) or "no-logic" (declarations only, with the reason). A file no
          # entry names, an entry naming nothing (unless optional: a downloaded or built tree) or a mutated entry without its mutants fails.
          node - <<'EOF'
          const fs = require("fs"), path = require("path");
          const entries = JSON.parse(fs.readFileSync("c-mutants/c-sources.json", "utf8"));
          const files = []; const walk = (d) => { for (const e of fs.readdirSync(d, { withFileTypes: true })) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (!p.endsWith(".swift")) files.push(p); } };
          walk("Sources");
          let bad = 0; const fail = (m) => { console.error("::error::" + m); bad++; };
          const match = (e, f) => e.path.endsWith("/") ? f.startsWith(e.path) : f === e.path;
          for (const e of entries) {
            if (!["mutated", "vendored", "no-logic"].includes(e.kind)) fail("bad kind: " + JSON.stringify(e));
            if (e.kind !== "mutated" && !(e.reason && e.reason.length >= 12)) fail("entry without a reason: " + e.path);
            if (e.kind === "mutated") for (const k of ["mutants", "ledger"]) { const f = `c-mutants/${e.target}.${k}.json`; if (!fs.existsSync(f)) fail(`${e.path}: ${f} missing`); }
            if (!e.optional && !files.some((f) => match(e, f))) fail("entry names no file: " + e.path);
          }
          for (const f of files) { const n = entries.filter((e) => match(e, f)).length; if (n !== 1) fail(`${f}: ${n} entries (want exactly 1)`); }
          const pk = require("child_process").execSync("grep -o 'path: \"[^\"]*\"' Package.swift | grep -v 'path: \"\\(Sources\\|Tests\\)/' || true", { encoding: "utf8" }).trim();
          if (pk) fail("outside the mutation plan: " + pk);
          console.log(`${files.length} non-Swift file(s) checked against ${entries.length} entries, ${bad} problem(s)`);
          process.exit(bad ? 1 : 0);
          EOF
          # every Swift target directory is mutated by the core shards or by a module slice of the matrix: none may fall between the two
          for d in $(cd Sources && find . -mindepth 1 -maxdepth 1 -type d ! -name 'C*' | sed 's|^\./||'); do
            case "$d" in AtlasPCAVerify|AtlasPCASQLite|AtlasPCAStepUp|pca-state-worker) continue ;; esac
            grep -q "dirs: '[^']*Sources/$d[ ']" .github/workflows/mutation.yml || { echo "::error::Sources/$d is in no mutation slice"; exit 1; }
          done
          [ "$(grep -c "find Sources -name '\*.swift'" .github/workflows/mutation.yml)" = 9 ] || { echo "::error::a mutation file list is not the recursive find"; exit 1; }
      - name: Every source file yields mutants, or is named with a reason
        run: node "$MONO/tools/pca-audit/swift-mutate/mutate.mjs" plan-check
      # one artifact per slice (mut-results-<k>: results.json + shard-<k>.json + run-errors/traps); every gate below walks this one directory
      - uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: mut-results-*
      - name: Merge shards and check the ledger
        # a ledgered equivalent that a test KILLED this run is a notice (nondeterministic killer), not a stale entry: stale-killed.mjs
        run: |
          rc=0
          node .github/scripts/mutation-merge.mjs --crate="$CRATE" --shards="$REPORTS" --reports=reports \
            --checker="$MONO/tools/pca-audit" --src="$GITHUB_WORKSPACE" > "$RUNNER_TEMP/merge.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/merge.log"
          node .github/scripts/stale-killed.mjs "$RUNNER_TEMP/merge.log" reports "$rc"
      # A TIMEOUT is no kill either (BRIEF "Timeouts are not kills", Java's rule): it is listed here too and needs a proof that the mutant itself never ends.
      # gate honesty: a RUNERR mutant ended without any test assertion deciding it (a signal with no trap message, a stack overflow or
      # the memory cap; a deterministic runtime trap is the TRAP bucket, checked below). Each must be in sdks/swift-pca/mutation-run-errors.json with a per-mutant reason the mutant itself caused it (the
      # unmutated group suite passes in the same sandbox); an unlisted one, a stale entry or a missing list fails.
      - name: Run errors (crash / memory cap, no assertion failed) are each proven mutant-caused
        if: ${{ !cancelled() }}
        run: node .github/scripts/runerr-gate.mjs reports reports "$MONO/sdks/swift-pca/mutation-run-errors.json" "$REPORTS"
      # a deterministic Swift runtime trap decided these mutants, not an assertion: a bucket of its own, never a plain kill. Each must
      # carry its file, line, mutant, failing test and trap message; a missing list or a missing field fails.
      - name: Runtime traps carry their evidence
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const got = []; let lists = 0;
            const walk = (d) => { for (const e of fs.readdirSync(d, { withFileTypes: true })) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (/^traps-\d+\.json$/.test(e.name)) { lists++; got.push(...JSON.parse(fs.readFileSync(p, "utf8"))); } } };
            walk("reports");
            const want = Number(process.env.REPORTS);
            if (lists !== want) { console.error(`::error::trap lists from ${lists}/${want} reports (a missing list is a failure)`); process.exit(1); }
            const bad = got.filter((m) => !m.file || !m.lineno || !m.mutant || !m.test || !m.message);
            for (const m of bad) console.error("::error::runtime trap without its evidence: " + JSON.stringify(m));
            console.log(`trap bucket: ${got.length} mutant(s) decided by a Swift runtime trap over ${lists} reports, ${bad.length} without evidence`);
            process.exit(bad.length ? 1 : 0);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survivors-merged
          path: reports/survivors-merged.json
          if-no-files-found: ignore

  reuse-record:
    name: reuse record
    needs: [reuse, snapshot, oracle, oracle-part, schema-plan, schema-build, plan0, plan1, plan2, plan3, run0-0, run0-1, run0-2, run0-3, run0-4, run0-5, run0-6, run0-7, run0-8, run0-9, run0-10, run0-11, run0-12, run0-13, run0-14, run0-15, run1-0, run1-1, run1-2, run1-3, run2-0, run2-1, run3-0, collect, apple-oracle, apple, apple-report, natives, module, module-linux, vdf, vdf-plan, vdf-full, vdf-report, cmutants, merge]
    # only a run whose jobs all passed (skipped by their own conditions is fine), that was not partial and not itself a reuse, leaves a record
    if: ${{ !cancelled() && needs.reuse.outputs.skip != 'true' && needs.reuse.outputs.hash != '' && !(false) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: rec
        env:
          GATE_FULL: ${{ inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]') }}
          HASH: ${{ needs.reuse.outputs.hash }}
        run: node .github/scripts/ci-reuse.mjs record --workflow=mutation --hash="$HASH" --out="$RUNNER_TEMP/reuse-record"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rec.outputs.artifact }}
          path: ${{ runner.temp }}/reuse-record/
          retention-days: 21
