        uses: actions/download-artifact@v4
        with:
          name: mut-pool
          path: ${{ runner.temp }}/pool
      - uses: actions/download-artifact@v4
        with:
          name: schema-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@v4
        with:
          name: oracle-linux
          path: ${{ runner.temp }}/oracle
      - name: Restore the baseline build (one tree is built here)
        run: |
          mkdir -p "$RUNNER_TEMP/smt/swiftmut"
          tar -I zstd -C "$RUNNER_TEMP/smt/swiftmut" -xf "$RUNNER_TEMP/oracle/build.tar.zst" w0
          rm -f "$RUNNER_TEMP/oracle/build.tar.zst"
      - name: Schema build + baseline trace
        working-directory: ${{ env.MONO }}
        run: |
          P=-; [ -f "$RUNNER_TEMP/pool/pool.json" ] && P="$RUNNER_TEMP/pool/pool.json"
          FILES="$(cd sdks/swift-pca && find Sources -name '*.swift' | LC_ALL=C sort | grep -v -E "$MODS_RE" | tr '\n' ' ')"
          node tools/pca-audit/swift-mutate/mutate.mjs schema-plan "$P" --groups="$SCHEMA_GROUPS" $FILES --group=${{ matrix.group }} --list="$RUNNER_TEMP/list.json" --plan="$RUNNER_TEMP/plan/plan.json"
