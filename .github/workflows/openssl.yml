name: OpenSSL

# AtlasPCAOpenSSL: the algorithms the verifier has no vetted pure-Swift implementation for (RSA RS/PS signing, Ed448), on OpenSSL libcrypto through
# CLibcrypto. Package.swift declares the product with ATLAS_PCA_OPENSSL=1 and adds it to the verifier test target, so the corpus cases that are
# refused natively without it (skipped) run here and must match the reference. No OpenSSL 3.5 needed: only RSA and Ed448 (OpenSSL >= 1.1.1).
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ATLAS_PCA_OPENSSL: '1'

jobs:
  openssl:
    name: swift test opt-in OpenSSL cases (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (the verifier's ML-DSA CryptoKit API)
        if: runner.os == 'macOS'
        run: |
          x="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$x" ] || { echo "::error::no Xcode 26 on this image"; exit 1; }
          sudo xcode-select -s "$x"
      - name: libcrypto through pkg-config
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew list pkgconf > /dev/null 2>&1 || brew install pkgconf
            brew list openssl@3 > /dev/null 2>&1 || brew install openssl@3
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq build-essential pkg-config libssl-dev libsodium-dev libsqlite3-dev
          fi
      - name: Flagship tooling + source layout
        if: runner.os == 'Linux'
        run: .github/scripts/mutation-layout.sh swift-pca
      - name: Linux toolchain (Swift, swift-crypto for CryptoKit)
        if: runner.os == 'Linux'
        working-directory: ${{ env.MONO }}
        run: |
          bash tools/pca-audit/swift-mutate/linux-prep.sh sdks/swift-pca
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
          echo "SWIFT_DIR=$MONO/sdks/swift-pca" >> "$GITHUB_ENV"
      - name: Flagship checkout (for the RSA DPoP corpus generator)
        if: runner.os == 'macOS'
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RSA DPoP corpus (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "${SWIFT_DIR:-$(pwd)}/test-data/ref-dpop-rsa.json.gz"
      - name: Build
        working-directory: ${{ env.SWIFT_DIR || '.' }}
        run: swift build --product AtlasPCAOpenSSL
      - name: Corpus cases that need RSA signing or Ed448 (with the product linked, a skip of those cases fails)
        working-directory: ${{ env.SWIFT_DIR || '.' }}
        run: swift test --filter 'RefDpopTests|RefOidcTests|RefAgentCardTests'
