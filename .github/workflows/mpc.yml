name: MPC

# AtlasPCAMpc: secret-shared computation (SPDZ / MASCOT, base OTs, the OT extension, the networked-runner codecs). SHAKE256, AES-128-ECB and ML-KEM-768 are
# OpenSSL libcrypto's through the CLibcrypto system library (never hand-written); ML-KEM (seeded keygen, deterministic encapsulation) needs OpenSSL 3.5, so
# this job builds the pinned 3.5 release and puts it on pkg-config's path, and the KEM and hybrid cases must run (a skip fails). Package.swift declares the
# product only with ATLAS_PCA_MPC=1. A matrix of macOS (Xcode 26 CryptoKit) and ubuntu (linux-prep.sh patches the verify target onto swift-crypto; libsodium-dev for the group; the same OpenSSL pin).
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSSL_VERSION: 3.5.9
  OPENSSL_SHA256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
  ATLAS_PCA_MPC: '1'

jobs:
  mpc:
    name: swift test AtlasPCAMpc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (the verifier's ML-DSA CryptoKit API)
        if: runner.os == 'macOS'
        run: |
          x="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$x" ] || { echo "::error::no Xcode 26 on this image"; exit 1; }
          sudo xcode-select -s "$x"
      - name: OpenSSL (cached)
        id: ossl
        uses: actions/cache@v4
        with:
          path: ~/openssl35
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Linux build tools and libsodium (the ratchet group)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential perl pkg-config libsodium-dev libsqlite3-dev
      - name: Build OpenSSL at the pinned release
        if: steps.ossl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/openssl.tgz" "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          echo "$OPENSSL_SHA256  $RUNNER_TEMP/openssl.tgz" | shasum -a 256 -c -
          tar xzf "$RUNNER_TEMP/openssl.tgz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-$OPENSSL_VERSION"
          ./config --prefix="$HOME/openssl35" --libdir=lib shared no-tests > /dev/null
          make -j4 > /dev/null
          make install_sw > /dev/null
      - name: libcrypto through pkg-config
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew list pkgconf > /dev/null 2>&1 || brew install pkgconf; fi
          echo "PKG_CONFIG_PATH=$HOME/openssl35/lib/pkgconfig" >> "$GITHUB_ENV"
          test "$(PKG_CONFIG_PATH=$HOME/openssl35/lib/pkgconfig pkg-config --modversion libcrypto)" = "$OPENSSL_VERSION"
      - name: Flagship tooling + source layout
        if: runner.os == 'Linux'
        run: .github/scripts/mutation-layout.sh swift-pca
      - name: Linux toolchain (Swift, swift-crypto for CryptoKit)
        if: runner.os == 'Linux'
        working-directory: ${{ env.MONO }}
        run: |
          bash tools/pca-audit/swift-mutate/linux-prep.sh sdks/swift-pca
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/openssl35/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "SWIFT_DIR=$MONO/sdks/swift-pca" >> "$GITHUB_ENV"
      - name: Flagship checkout (for the secret-key corpus generator)
        if: runner.os == 'macOS'
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Secret-key oracle corpus (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "${SWIFT_DIR:-$(pwd)}/test-data" mpc-ot:mpc-ot
      - name: Build
        working-directory: ${{ env.SWIFT_DIR || '.' }}
        run: swift build --product AtlasPCAMpc
      - name: SPDZ, MASCOT, OT stack (SHAKE256, AES-128, ML-KEM byte for byte) and networked codecs
        env:
          PCA_MPC_REQUIRE_KEM: '1'
        working-directory: ${{ env.SWIFT_DIR || '.' }}
        run: swift test --filter AtlasPCAMpcTests
