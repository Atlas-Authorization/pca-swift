name: Pairing packages

# AtlasPCAPairing: pca-aggsig, pca-bbs and pca-abe on BLS12-381. Curve and pairing work is supranational blst; ABE's GT
# operations are a small shim over blst's public API (Sources/CBlst/pca_gt.c). blst's C sources are vendored in Sources/CBlst/blst (pinned commit,
# checked against Sources/vendored.sha256); only a checkout that does not have them yet fetches the pinned commit here.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BLST_TAG: v0.3.16
  BLST_COMMIT: e7f90de551e8df682f3cc99067d204d8b90d27ad

jobs:
  pairing:
    name: swift test AtlasPCAPairing (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (the verifier's ML-DSA CryptoKit API)
        run: |
          x="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$x" ] || { echo "::error::no Xcode 26 on this image"; exit 1; }
          sudo xcode-select -s "$x"
      - name: Vendored blst is the pinned release (fetched when absent)
        run: |
          if [ -s Sources/CBlst/blst/src/server.c ]; then grep ' Sources/CBlst/' Sources/vendored.sha256 | shasum -a 256 -c -; exit 0; fi
          git clone --quiet --depth 1 --branch "$BLST_TAG" https://github.com/supranational/blst "$RUNNER_TEMP/blst"
          test "$(git -C "$RUNNER_TEMP/blst" rev-parse HEAD)" = "$BLST_COMMIT"
          mkdir -p Sources/CBlst/blst
          cp -R "$RUNNER_TEMP/blst/src" "$RUNNER_TEMP/blst/build" "$RUNNER_TEMP/blst/bindings" Sources/CBlst/blst/
          cp "$RUNNER_TEMP/blst/bindings/blst.h" "$RUNNER_TEMP/blst/bindings/blst_aux.h" Sources/CBlst/include/
          test -s Sources/CBlst/blst/src/server.c
      - name: Build
        run: swift build --product AtlasPCAPairing
      - name: Flagship checkout (for the ABE secret-key corpus generator)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Secret-key oracle corpora (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$(pwd)/test-data" abe:abe
      - name: GT shim, aggsig, bbs and abe (vendored reference corpora)
        run: swift test --filter AtlasPCAPairingTests
