name: libsodium (Linux)

# On Linux the verifier builds libsodium from the vendored upstream release (Sources/CSodium), so no libsodium package is installed or needed. This job
# proves the vendored tree is the pinned official release (SHA-256 of the tarball, then every .c and .h compared byte for byte; the only added file is the
# release's prebuilt include/sodium/version.h), then builds and runs the ristretto, FROST and OPRF tests in a container with no libsodium on it.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SODIUM_VERSION: 1.0.20
  SODIUM_SHA256: ebb65ef6ca439333c2bb41a0c1990587288da07f6c7fd07cb3a18cc18d30ce19

jobs:
  libsodium:
    runs-on: ubuntu-24.04
    container: swift:6.2
    timeout-minutes: 60
    env:
      PCA_REQUIRE_PQ: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Vendored sources are the pinned release
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq curl >/dev/null
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/s.tgz" "https://download.libsodium.org/libsodium/releases/libsodium-$SODIUM_VERSION.tar.gz"
          echo "$SODIUM_SHA256  $RUNNER_TEMP/s.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/s" && tar -xzf "$RUNNER_TEMP/s.tgz" -C "$RUNNER_TEMP/s"
          up="$RUNNER_TEMP/s/libsodium-$SODIUM_VERSION"
          count=0
          while IFS= read -r f; do
            cmp "$up/src/libsodium/$f" "Sources/CSodium/$f"; count=$((count + 1))
          done < <(cd "$up/src/libsodium" && find . \( -name '*.c' -o -name '*.h' \) | sort)
          cmp "$up/builds/msvc/version.h" Sources/CSodium/include/sodium/version.h
          vendored="$(cd Sources/CSodium && find . \( -name '*.c' -o -name '*.h' \) | wc -l)"
          [ "$vendored" -eq "$((count + 1))" ] || { echo "::error::vendored file count $vendored differs from upstream $count (+ version.h)"; exit 1; }
          echo "$count files identical to libsodium $SODIUM_VERSION"
      - name: No system libsodium
        run: "! ldconfig -p | grep -q libsodium"
      - name: Container tools for the Linux prep
        run: apt-get install -y -qq cmake python3 sudo git curl ca-certificates libsqlite3-dev binutils >/dev/null
      - name: Flagship tooling + source layout
        run: .github/scripts/mutation-layout.sh swift-pca
      - name: Linux toolchain (Swift, swift-crypto for CryptoKit) + build incl. tests (CSodium from source)
        working-directory: ${{ env.MONO }}
        run: |
          bash tools/pca-audit/swift-mutate/linux-prep.sh sdks/swift-pca
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: FROST secret-key oracle corpus (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/swift-pca/test-data" core-frost-swift:frost frost-dkg:frost-dkg
      - name: Ristretto, FROST and OPRF on the vendored libsodium
        working-directory: ${{ env.MONO }}/sdks/swift-pca
        run: swift test --filter 'Ratchet|Frost|Oprf'
