name: SLH-DSA

# SLH-DSA (FIPS 205, SHA2-128f / SHA2-256s) on OpenSSL libcrypto 3.5+ through the opt-in AtlasPCAOpenSSL product (PCAOpenSSL.registerSlhDsa()): every SLH-DSA case of
# the producer-pq vectors must reproduce the reference byte for byte. libcrypto older than 3.5 has no SLH-DSA, so this job pins 3.5+ and a missing algorithm fails (CI is set).
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ATLAS_PCA_OPENSSL: '1'

jobs:
  slhdsa:
    name: swift test SLH-DSA through libcrypto 3.5 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (the verifier's ML-DSA CryptoKit API)
        if: runner.os == 'macOS'
        run: |
          x="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$x" ] || { echo "::error::no Xcode 26 on this image"; exit 1; }
          sudo xcode-select -s "$x"
      - name: libcrypto through pkg-config
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew list pkgconf > /dev/null 2>&1 || brew install pkgconf
            brew list openssl@3 > /dev/null 2>&1 || brew install openssl@3
            "$(brew --prefix openssl@3)/bin/openssl" version | grep -E 'OpenSSL 3\.([5-9]|[1-9][0-9])' || { echo "::error::brew openssl@3 is older than 3.5"; exit 1; }
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq build-essential pkg-config libsodium-dev libsqlite3-dev perl
            # the runner image's libssl is older than 3.5: build the 3.5 series from source (no SLH-DSA before it)
            v=3.5.4
            curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-$v/openssl-$v.tar.gz" -o "$RUNNER_TEMP/openssl.tgz"
            mkdir -p "$RUNNER_TEMP/openssl-src" && tar -xzf "$RUNNER_TEMP/openssl.tgz" -C "$RUNNER_TEMP/openssl-src" --strip-components=1
            (cd "$RUNNER_TEMP/openssl-src" && ./config --prefix="$HOME/openssl35" --libdir=lib no-docs no-tests && make -j"$(nproc)" && make install_sw)
            echo "PKG_CONFIG_PATH=$HOME/openssl35/lib/pkgconfig" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=$HOME/openssl35/lib" >> "$GITHUB_ENV"
          fi
      - name: Flagship tooling + source layout
        if: runner.os == 'Linux'
        run: .github/scripts/mutation-layout.sh swift-pca
      - name: Linux toolchain (Swift, swift-crypto for CryptoKit)
        if: runner.os == 'Linux'
        working-directory: ${{ env.MONO }}
        run: |
          bash tools/pca-audit/swift-mutate/linux-prep.sh sdks/swift-pca
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
          echo "SWIFT_DIR=$MONO/sdks/swift-pca" >> "$GITHUB_ENV"
      - name: Build
        working-directory: ${{ env.SWIFT_DIR || '.' }}
        run: swift build --product AtlasPCAOpenSSL
      - name: SLH-DSA cases (the producer-pq vectors and the hook round trips; a missing backend fails)
        working-directory: ${{ env.SWIFT_DIR || '.' }}
        run: swift test --filter 'SlhDsaOpenSSLTests'
      - name: Hybrid KEM cases (X25519 + ML-KEM-768 / 1024 and X-Wing against the reference corpus, incl. the draft-09 X-Wing vectors; a missing backend fails)
        working-directory: ${{ env.SWIFT_DIR || '.' }}
        run: swift test --filter 'RefKemTests'
      - name: PQ quorum (deterministic ML-DSA shares byte for byte against the reference corpus, SLH-DSA shares verified; a missing backend fails)
        working-directory: ${{ env.SWIFT_DIR || '.' }}
        run: swift test --filter 'RefPqQuorumTests'
      - name: Safety certificate (ML-DSA-65 and hybrid certificates byte for byte against the reference corpus; a missing backend fails)
        working-directory: ${{ env.SWIFT_DIR || '.' }}
        run: swift test --filter 'RefSafetyCertificateTests|RefAttestationSoftTests|RefAttestPqSoftwareTests|RefAttestPufTests|RefAttestAllowlistTests|RefAttestMaaTests|RefSemanticThresholdTests|RefPassportTests|RefBeaconsTests|RefActionSchemaTests|RefActionPinTests|RefIntentMisc2Tests|RefFrostNetTests|RefFrostDkgTests|RefAttestNvidiaTests'
